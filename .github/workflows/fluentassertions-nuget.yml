name: Publish FluentAssertions to NuGet

on:
  push:
    tags:
      - 'fa-v*'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release --no-restore --verbosity normal

  publish:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#fa-v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore src/Resultron.FluentAssertions/Resultron.FluentAssertions.csproj

      - name: Build
        run: dotnet build src/Resultron.FluentAssertions/Resultron.FluentAssertions.csproj --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/Resultron.FluentAssertions/Resultron.FluentAssertions.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --output ./artifacts \
            -p:Version=${{ steps.version.outputs.version }}

      - name: NuGet Login
        id: login
        uses: NuGet/login@v1
        with:
          user: ferdikurnazdm

      - name: Push
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json
